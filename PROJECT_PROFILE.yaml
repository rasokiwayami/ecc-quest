schema_version: 6

project:
  repo: rasokiwayami/ecc-quest
  type: supporting_tool
  domain: coding_training
  primary_goal: ECC and coding workflow practice through local quests and a Node.js progress CLI
  default_branch: main
  visibility: private_or_public_per_current_remote
  authority:
    # These are target-local filters; central authority and task evidence still decide execution.
    allowed_actions:
      - dev.local_inspect
      - dev.local_edit
      - dev.local_test
      - dev.local_commit
    forbidden_actions:
      - dev.repo_create_visibility_deploy_or_publish
      - dev.secret_or_security_mutation
      - dev.production_data_mutation
      - auth.secret_read_or_print
      - finance.spending_or_paid_service_change
      - dev.destructive_action

runtime:
  local_only: true
  deployment: none
  languages:
    - javascript
    - markdown
  package_managers:
    - none_required
  operating_environment:
    - Mac local operation under /Users/sora/dev/ecc-quest
    - Legacy Windows/WSL usage is supported only through normal Node.js execution

verification:
  default:
    - node --check scripts/check.js
  formatting:
    - git diff --check

state:
  ignored_runtime_dirs:
    - .pytest_cache/
    - node_modules/
  canonical_progress:
    - AGENTS.md
    - PROJECT_PROFILE.yaml
    - quests/
    - scripts/check.js
